version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kantine-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kantine_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: kantine-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kantine_db
      PORT: 5000
      JWT_SECRET: katzweiler_secret_key_123
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kantine-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kantine-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiZDdjZmU3NTYyNzI1MmY0YjA0NzY1Njk1YTlmODdmOGUiLCJ0IjoiY2Y5MTQ1OGUtM2UzYS00N2I4LThkNGYtNThhNGVlMjJlODE4IiwicyI6Ik4ySmxNamc0WldZdFkySTRNeTAwTW1VMUxXRmxPV0V0WW1Wa1l6azFOelZsTkdOayJ9

volumes:
  postgres_data:
